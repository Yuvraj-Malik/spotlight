[package]
name = "spotlight"
version = "0.1.0"
edition = "2021"

[lib]
name = "spotlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
fuzzy-matcher = "0.3"
meval = "0.2"
open = "5"
parking_lot = "0.12"
urlencoding = "2"
png = "0.17"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
regex = "1"
dotenvy = "0.15"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
